<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Maze Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one-screen arcade cabinet — slim HUD bar, maze stage filling the rest, d-pad under it on touch devices. Single dark theme by choice. */
:root{
  --bg:#0b0a18; --panel:#16142c; --ink:#f2efff; --muted:#9a95c4;
  --accent:#ff3dcb; --accent2:#33e1ff; --kid:#7ccf5b; --kidink:#fff7d6;
  --f-display:"Bungee","Impact",system-ui,sans-serif;
  --f-body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-hud:"Chakra Petch","Menlo",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.04em;color:var(--accent)}
body.kids .brand{color:var(--kid)}
.hud{display:flex;gap:14px;font-family:var(--f-hud);font-variant-numeric:tabular-nums;align-items:center;flex-wrap:wrap}
.hud span{display:flex;flex-direction:column;line-height:1.1}
.hud small{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hud b{font-size:1.05rem}
#lives{color:var(--accent);letter-spacing:.1em}
body.kids #lives{color:#ff7aa8}
.icons{display:flex;gap:6px}
.ib{background:var(--panel);color:var(--ink);border:1px solid #2c2852;border-radius:8px;
  font:700 .8rem var(--f-hud);padding:6px 10px;cursor:pointer}
.ib:focus-visible,.btn:focus-visible,.seg button:focus-visible,.pad button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none}
canvas{display:block;border-radius:10px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(8,7,20,.82);border-radius:12px;padding:16px;overflow:auto}
.card{max-width:520px;width:100%;display:flex;flex-direction:column;gap:16px;text-align:center}
.card h1{font-family:var(--f-display);font-size:clamp(2rem,8vw,3.2rem);margin:0;line-height:1;
  color:var(--accent);text-shadow:0 0 18px rgba(255,61,203,.5);text-wrap:balance}
body.kids .card h1{color:var(--kid);text-shadow:0 0 18px rgba(124,207,91,.45)}
.card p{margin:0;color:var(--muted);font-size:1rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid #2c2852;background:var(--panel);border-radius:14px;padding:14px 10px;cursor:pointer;
  color:var(--ink);display:flex;flex-direction:column;gap:4px;align-items:center;font-family:var(--f-body)}
.mode strong{font-size:1.15rem}
.mode em{font-style:normal;font-size:.85rem;color:var(--muted)}
.mode canvas{border-radius:8px}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,61,203,.2)}
.mode.k[aria-pressed="true"]{border-color:var(--kid);box-shadow:0 0 0 3px rgba(124,207,91,.25)}
.lbl{font:700 .7rem var(--f-hud);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px;border:1px solid #2c2852}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:700 1rem var(--f-body);padding:9px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1a0716}
body.kids .seg button[aria-pressed="true"]{background:var(--kid);color:#10240a}
.btn{border:0;border-radius:14px;background:var(--accent);color:#1a0716;font:400 1.3rem var(--f-display);
  padding:14px 18px;cursor:pointer;letter-spacing:.05em}
body.kids .btn{background:var(--kid);color:#10240a}
.help{font-size:.85rem;color:var(--muted)}
.big{font-family:var(--f-hud);font-size:1.6rem;font-variant-numeric:tabular-nums}
.pad{display:none;justify-content:center;padding-bottom:4px}
.pad .grid{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px}
.pad button{background:var(--panel);border:1px solid #2c2852;border-radius:12px;color:var(--ink);font-size:1.4rem;touch-action:none}
.pad button:active{background:#2a2550}
@media (pointer:coarse){.pad{display:flex}}
@media (max-width:420px){.hud{gap:10px}.brand{font-size:1rem}}
@media (prefers-reduced-motion:reduce){.card h1{text-shadow:none}}
</style>

<div class="app">
  <header>
    <div class="brand">MAZE DASH</div>
    <div class="hud">
      <span><small>Score</small><b id="score">0</b></span>
      <span><small>Best</small><b id="best">0</b></span>
      <span><small>Level</small><b id="level">1</b></span>
      <span><small>Lives</small><b id="lives">♥♥♥</b></span>
    </div>
    <div class="icons">
      <button class="ib" id="pauseBtn" aria-label="Pause">II</button>
      <button class="ib" id="muteBtn" aria-label="Sound on or off">SND</button>
      <button class="ib" id="menuBtn">MENU</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="menu">
      <div class="card">
        <h1>MAZE DASH</h1>
        <p>Clear every dot, grab a power-up, turn the tables.</p>
        <div class="modes">
          <button class="mode k" id="mKids" aria-pressed="false">
            <canvas id="pvKids" width="60" height="44"></canvas>
            <strong>Garden Run</strong><em>Kids · a bunny, berries and sleepy bees</em>
          </button>
          <button class="mode" id="mAdult" aria-pressed="true">
            <canvas id="pvAdult" width="60" height="44"></canvas>
            <strong>Night Circuit</strong><em>Grown-ups · fast, smart glitches</em>
          </button>
        </div>
        <div class="lbl">Difficulty</div>
        <div class="seg" id="diff">
          <button data-d="easy" aria-pressed="false">Easy</button>
          <button data-d="normal" aria-pressed="true">Normal</button>
          <button data-d="hard" aria-pressed="false">Hard</button>
        </div>
        <button class="btn" id="startBtn">START</button>
        <div class="help">Arrow keys or WASD · swipe on the maze · d-pad on tablets · P to pause.<br>3 mazes rotate, and every level gets a little faster.</div>
      </div>
    </div>
    <div class="overlay" id="msg" hidden>
      <div class="card">
        <h1 id="msgTitle">GAME OVER</h1>
        <div class="big" id="msgScore"></div>
        <p id="msgSub"></p>
        <button class="btn" id="msgBtn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <div class="pad" id="pad">
    <div class="grid">
      <span></span><button data-k="up" aria-label="Up">▲</button><span></span>
      <button data-k="left" aria-label="Left">◀</button><button data-k="down" aria-label="Down">▼</button><button data-k="right" aria-label="Right">▶</button>
    </div>
  </div>
</div>

<script>
(()=>{
const MAZES=[
["###################",
 "#........#........#",
 "#o##.###.#.###.##o#",
 "#.................#",
 "#.##.#.#####.#.##.#",
 "#....#...#...#....#",
 "####.###.#.###.####",
 "####.#.......#.####",
 "####.#.##-##.#.####",
 ".......#EEE#.......",
 "####.#.#####.#.####",
 "####.#...P...#.####",
 "####.#.#####.#.####",
 "#........#........#",
 "#.##.###.#.###.##.#",
 "#o.#...........#.o#",
 "##.#.#.#####.#.#.##",
 "#....#...#...#....#",
 "#.######.#.######.#",
 "#.................#",
 "###################"],
["###################",
 "#o...#.......#...o#",
 "#.##.#.#####.#.##.#",
 "#.................#",
 "##.#.###.#.###.#.##",
 "#..#.....#.....#..#",
 "#.##.##.###.##.##.#",
 "#....#.......#....#",
 "###.##.##-##.##.###",
 ".......#EEE#.......",
 "###.##.#####.##.###",
 "#....#...P...#....#",
 "#.##.#.#####.#.##.#",
 "#.#.....#.#.....#.#",
 "#.#.###.#.#.###.#.#",
 "#o..#.........#..o#",
 "###.#.##.#.##.#.###",
 "#.....#..#..#.....#",
 "#.###.#.###.#.###.#",
 "#.................#",
 "###################"],
["###################",
 "#.......#.#.......#",
 "#o#.###.#.#.###.#o#",
 "#.#.............#.#",
 "#...#.##.#.##.#...#",
 "###.#....#....#.###",
 "#...###.###.###...#",
 "#.#.#.........#.#.#",
 "#......##-##......#",
 ".......#EEE#.......",
 "#.#.#..#####..#.#.#",
 "#.#.#....P....#.#.#",
 "#...###.###.###...#",
 "###.#....#....#.###",
 "#...#.##.#.##.#...#",
 "#o#.............#o#",
 "#.#.###.#.#.###.#.#",
 "#.......#.#.......#",
 "#.#####.#.#.#####.#",
 "#.................#",
 "###################"]];

const SET={
 kids:{easy:{ps:4.2,er:.52,acc:.2,pw:12,lives:5,en:2,rel:5,sc:9,ch:10},
       normal:{ps:4.5,er:.62,acc:.4,pw:10,lives:4,en:3,rel:4,sc:8,ch:12},
       hard:{ps:4.8,er:.72,acc:.6,pw:8,lives:3,en:3,rel:3,sc:7,ch:15}},
 adult:{easy:{ps:5.6,er:.75,acc:.6,pw:8,lives:3,en:3,rel:3,sc:7,ch:18},
       normal:{ps:6,er:.88,acc:.85,pw:6,lives:3,en:4,rel:2.5,sc:6,ch:20},
       hard:{ps:6.4,er:.98,acc:.97,pw:4,lives:3,en:4,rel:1.6,sc:5,ch:25}}};

const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const DLIST=[[0,-1],[-1,0],[0,1],[1,0]];
const COLORS_ADULT=["#ff4d5e","#ffb020","#a06bff","#9dff4a"];
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

let mode="adult",diff="normal",muted=false,state="menu",G=null,T=20,W=19,H=21,wallLayer=null,time=0;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
muted=lsGet("md_muted")==="1";
const saved=lsGet("md_prefs");if(saved){try{const s=JSON.parse(saved);mode=s.mode||mode;diff=s.diff||diff}catch(e){}}

/* ---------- sound ---------- */
let AC=null;
function beep(f,d=.06,type="square",v=.05,slide=0){
  if(muted)return;try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const sfx={
  dot:()=>{G.tick^=1;beep(mode==="kids"?(G.tick?660:880):(G.tick?220:330),.05,mode==="kids"?"sine":"square",.035)},
  power:()=>beep(mode==="kids"?520:180,.35,"triangle",.08,mode==="kids"?1040:720),
  eat:()=>beep(400,.25,"sawtooth",.06,1600),
  die:()=>beep(mode==="kids"?500:440,.8,"triangle",.08,mode==="kids"?200:60),
  clear:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15,"triangle",.07),i*110))},
  life:()=>beep(880,.3,"sine",.07,1320)
};

/* ---------- level ---------- */
function cfg(){
  const b=SET[mode][diff],L=G.level-1;
  return{ps:b.ps*(1+Math.min(L,8)*.02),er:Math.min(b.er*(1+L*.05),mode==="kids"?.9:1.08),
    acc:Math.min(1,b.acc+L*.03),pw:Math.max(mode==="kids"?5:2,b.pw-L*.7),
    en:Math.min(4,b.en+Math.floor(L/2)),rel:b.rel/(1+L*.12),sc:b.sc,ch:b.ch};
}
function newGame(){
  G={level:1,score:0,lives:SET[mode][diff].lives,tick:0,nextLife:10000,floats:[]};
  startLevel();
}
function startLevel(){
  const src=MAZES[(G.level-1)%MAZES.length];
  H=src.length;W=src[0].length;
  G.grid=src.map(r=>r.split(""));G.pen=[];G.dots=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=G.grid[y][x];
    if(c==="P"){G.start=[x,y];G.grid[y][x]=" "}
    else if(c==="-"){G.door=[x,y]}
    else if(c==="E"){G.pen.push([x,y])}
  }
  // drop any dot the player can't reach
  const seen=new Set([G.start+""]),q=[G.start];
  while(q.length){const[x,y]=q.shift();for(const[dx,dy] of DLIST){const nx=(x+dx+W)%W,ny=y+dy;
    if(ny<0||ny>=H)continue;const c=G.grid[ny][nx];if(c==="#"||c==="-"||c==="E")continue;
    const k=nx+","+ny;if(!seen.has(k)){seen.add(k);q.push([nx,ny])}}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=G.grid[y][x];
    if(c==="."||c==="o"){if(seen.has(x+","+y))G.dots++;else G.grid[y][x]=" "}}
  G.exit=[G.door[0],G.door[1]-1];
  G.penCenter=G.pen[Math.floor(G.pen.length/2)];
  G.C=cfg();resize();resetActors();
  state="ready";G.readyT=1.8;
}
function resetActors(){
  G.pl={kind:"p",tx:G.start[0],ty:G.start[1],dir:[-1,0],want:null,p:0,moving:false,face:[-1,0],anim:0};
  G.en=[];
  for(let i=0;i<G.C.en;i++){
    const pc=G.pen[[1,0,2,1][i]];
    G.en.push({kind:"e",id:i,tx:pc[0],ty:pc[1],dir:null,p:0,state:"pen",fright:false,
      release:i===0?.4:i*G.C.rel,bob:i,eatenT:0,color:COLORS_ADULT[i]});
  }
  G.powerT=0;G.chain=0;G.modeT=0;G.scatter=true;
}

/* ---------- movement ---------- */
const wrapX=x=>(x+W)%W;
function passable(e,x,y){
  if(y<0||y>=H)return false;const c=G.grid[y][wrapX(x)];
  if(c==="#")return false;
  if(c==="-")return e.kind==="e"&&(e.state==="leave"||e.state==="eaten");
  if(c==="E")return e.kind==="e";
  return true;
}
function pos(e){return[e.tx+(e.dir?e.dir[0]*e.p:0),e.ty+(e.dir?e.dir[1]*e.p:0)]}
function reverse(e){
  if(!e.dir)return;
  if(e.p>0){e.tx=wrapX(e.tx+e.dir[0]);e.ty+=e.dir[1];e.p=1-e.p}
  e.dir=[-e.dir[0],-e.dir[1]];
}
function updPlayer(dt){
  const pl=G.pl,sp=G.C.ps*(G.powerT>0?1.08:1);
  if(pl.want&&pl.dir&&pl.moving&&pl.want[0]===-pl.dir[0]&&pl.want[1]===-pl.dir[1]){reverse(pl);pl.face=pl.dir}
  if(!pl.moving){
    if(pl.want&&passable(pl,pl.tx+pl.want[0],pl.ty+pl.want[1])){pl.dir=pl.want;pl.moving=true}
    else if(pl.dir&&passable(pl,pl.tx+pl.dir[0],pl.ty+pl.dir[1]))pl.moving=true;
    else return;
    pl.face=pl.dir;
  }
  pl.anim+=dt*10;pl.p+=sp*dt;
  while(pl.p>=1){
    pl.tx=wrapX(pl.tx+pl.dir[0]);pl.ty+=pl.dir[1];pl.p-=1;eatAt(pl.tx,pl.ty);
    if(pl.want&&passable(pl,pl.tx+pl.want[0],pl.ty+pl.want[1]))pl.dir=pl.want;
    else if(!passable(pl,pl.tx+pl.dir[0],pl.ty+pl.dir[1])){pl.p=0;pl.moving=false;break}
    pl.face=pl.dir;
  }
}
function eatAt(x,y){
  const c=G.grid[y][x];
  if(c==="."){G.grid[y][x]=" ";G.dots--;addScore(10);sfx.dot()}
  else if(c==="o"){G.grid[y][x]=" ";G.dots--;addScore(50);sfx.power();
    G.powerT=G.C.pw;G.chain=0;
    for(const e of G.en)if(e.state==="normal"||e.state==="leave"){if(!e.fright&&e.state==="normal")reverse(e);e.fright=true}}
  if(G.dots<=0){state="clear";G.clearT=2.2;sfx.clear()}
}
function addScore(n){
  G.score+=n;
  if(mode==="adult"&&G.score>=G.nextLife){G.lives++;G.nextLife+=10000;sfx.life()}
  if(mode==="kids"&&G.score>=G.nextLife){G.lives++;G.nextLife+=5000;sfx.life()}
}
function target(e){
  const pl=G.pl,[px,py]=[pl.tx,pl.ty];
  if(e.state==="leave")return G.exit;
  if(e.state==="eaten")return G.penCenter;
  const corners=[[W-2,0],[1,0],[W-2,H-1],[1,H-1]];
  if(G.scatter)return corners[e.id];
  const d=pl.dir||[0,0];
  switch(e.id){
    case 0:return[px,py];
    case 1:return[px+d[0]*4,py+d[1]*4];
    case 2:{const a=G.en[0];return a?[px*2-a.tx+d[0]*2,py*2-a.ty+d[1]*2]:[px,py]}
    default:return Math.hypot(e.tx-px,e.ty-py)>7?[px,py]:corners[3];
  }
}
function chooseDir(e){
  const opts=DLIST.filter(([dx,dy])=>passable(e,e.tx+dx,e.ty+dy));
  if(!opts.length){e.dir=null;return}
  let pool=e.dir?opts.filter(([dx,dy])=>!(dx===-e.dir[0]&&dy===-e.dir[1])):opts;
  if(!pool.length)pool=opts;
  const smart=e.state==="leave"||e.state==="eaten"||(!e.fright&&Math.random()<G.C.acc);
  if(!smart){e.dir=pool[Math.floor(Math.random()*pool.length)];return}
  const t=target(e);let best=null,bd=1e9;
  for(const o of pool){const nx=e.tx+o[0],ny=e.ty+o[1],dd=(nx-t[0])**2+(ny-t[1])**2;if(dd<bd){bd=dd;best=o}}
  e.dir=best;
}
function arriveEnemy(e){
  if(e.state==="leave"&&e.tx===G.exit[0]&&e.ty===G.exit[1]){e.state="normal";e.fright=false}
  else if(e.state==="eaten"&&e.tx===G.penCenter[0]&&e.ty===G.penCenter[1]){e.state="leave";e.dir=null}
}
function updEnemy(e,dt){
  if(e.state==="pen"){e.bob+=dt;e.release-=dt;if(e.release<=0){e.state="leave";e.dir=null;e.p=0}return}
  if(e.state==="eaten"){e.eatenT+=dt;if(e.eatenT>9){[e.tx,e.ty]=G.penCenter;e.p=0;e.state="leave";e.dir=null}}
  const ps=G.C.ps;
  let sp=e.state==="eaten"?ps*1.7:e.fright?ps*.5:e.state==="leave"?ps*.6:ps*G.C.er;
  if(G.grid[e.ty][e.tx]===" "&&(e.tx===0||e.tx===W-1)&&e.state!=="eaten")sp*=.6;
  if(!e.dir){chooseDir(e);if(!e.dir)return}
  e.p+=sp*dt;
  while(e.p>=1){
    e.tx=wrapX(e.tx+e.dir[0]);e.ty+=e.dir[1];e.p-=1;arriveEnemy(e);chooseDir(e);
    if(!e.dir){e.p=0;break}
  }
}
function collide(){
  const[px,py]=pos(G.pl);
  for(const e of G.en){
    if(e.state==="pen"||e.state==="eaten")continue;
    const[ex,ey]=pos(e);let dx=Math.abs(ex-px);dx=Math.min(dx,W-dx);
    if(dx*dx+(ey-py)**2<.36){
      if(e.fright){
        e.fright=false;e.state="eaten";e.eatenT=0;G.chain++;const pts=200*2**(G.chain-1);addScore(pts);sfx.eat();
        G.floats.push({x:ex,y:ey,t:1,txt:String(pts)});
      }else{
        G.lives--;sfx.die();state="dying";G.dieT=1.4;return;
      }
    }
  }
}
function update(dt){
  time+=dt;
  for(const f of G.floats)f.t-=dt;G.floats=G.floats.filter(f=>f.t>0);
  if(state==="ready"){G.readyT-=dt;if(G.readyT<=0)state="play";return}
  if(state==="dying"){G.dieT-=dt;if(G.dieT<=0){if(G.lives<=0)gameOver();else{resetActors();state="ready";G.readyT=1.4}}return}
  if(state==="clear"){G.clearT-=dt;if(G.clearT<=0){G.level++;startLevel()}return}
  if(state!=="play")return;
  if(G.powerT>0){G.powerT-=dt;if(G.powerT<=0){G.powerT=0;for(const e of G.en)e.fright=false}}
  else{G.modeT+=dt;const lim=G.scatter?G.C.sc:G.C.ch;
    if(G.modeT>=lim){G.modeT=0;G.scatter=!G.scatter;if(mode==="adult")for(const e of G.en)if(e.state==="normal")reverse(e)}}
  updPlayer(dt);if(state!=="play")return;
  collide();if(state!=="play")return;
  for(const e of G.en)updEnemy(e,dt);
  collide();
}
function gameOver(){
  state="over";const k="md_best_"+mode+"_"+diff,b=+(lsGet(k)||0);
  if(G.score>b)lsSet(k,G.score);
  showMsg(mode==="kids"?"GREAT RUN!":"GAME OVER",G.score+" pts",
    (G.score>b?"New best for this mode! ":"Best: "+Math.max(b,G.score)+". ")+"You reached level "+G.level+".");
}

/* ---------- drawing ---------- */
const TH={
  kids:{bg:"#cfe9a8",path:"#e3f3c4",wall:"#3f8f4b",wallHi:"#62b56c",edge:"#2b6b36",dot:"#e0405a",door:"#fff7d6"},
  adult:{bg:"#07071a",path:"#07071a",wall:"#120f30",wallHi:"#1d1846",edge:"#ff3dcb",dot:"#6ff7ff",door:"#ffd1f3"}};
function resize(){
  if(!G)return;
  const r=stage.getBoundingClientRect();
  T=Math.max(10,Math.floor(Math.min(r.width/W,r.height/H)));
  const dpr=window.devicePixelRatio||1;
  cv.width=W*T*dpr;cv.height=H*T*dpr;cv.style.width=W*T+"px";cv.style.height=H*T+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildWalls(dpr);
}
function isWall(x,y){if(y<0||y>=H||x<0||x>=W)return true;return G.grid[y][x]==="#"}
function buildWalls(dpr){
  const th=TH[mode],c=document.createElement("canvas");c.width=W*T*dpr;c.height=H*T*dpr;
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=th.path;g.fillRect(0,0,W*T,H*T);
  if(mode==="kids"){ // grass flecks
    g.fillStyle="rgba(120,180,80,.35)";
    for(let i=0;i<W*H*1.5;i++){const x=(i*73.13%W)*T,y=(i*37.7%H)*T;g.fillRect(x,y,2,2)}
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(isWall(x,y)){g.fillStyle=th.wall;g.fillRect(x*T,y*T,T,T)}
  g.lineCap="round";
  if(mode==="adult"){g.shadowColor=th.edge;g.shadowBlur=T*.4}
  g.strokeStyle=th.edge;g.lineWidth=mode==="adult"?Math.max(1.5,T*.09):Math.max(2,T*.14);
  g.beginPath();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!isWall(x,y))continue;const X=x*T,Y=y*T;
    if(!isWall(x,y-1)&&y>0){g.moveTo(X,Y);g.lineTo(X+T,Y)}
    if(!isWall(x,y+1)&&y<H-1){g.moveTo(X,Y+T);g.lineTo(X+T,Y+T)}
    if(!isWall(x-1,y)&&x>0){g.moveTo(X,Y);g.lineTo(X,Y+T)}
    if(!isWall(x+1,y)&&x<W-1){g.moveTo(X+T,Y);g.lineTo(X+T,Y+T)}
  }
  g.stroke();g.shadowBlur=0;
  if(mode==="kids"){ // hedge texture
    g.fillStyle=th.wallHi;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(isWall(x,y)&&(x*7+y*3)%4===0){
      g.beginPath();g.arc(x*T+T*.35,y*T+T*.4,T*.14,0,7);g.fill()}
  }
  const[dx,dy]=G.door;g.fillStyle=th.door;g.fillRect(dx*T,dy*T+T*.42,T,T*.16);
  wallLayer=c;
}
function drawDots(){
  const th=TH[mode];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=G.grid[y][x],cx=x*T+T/2,cy=y*T+T/2;
    if(c==="."){
      if(mode==="kids"){ctx.fillStyle=th.dot;ctx.beginPath();ctx.arc(cx,cy,T*.13,0,7);ctx.fill();
        ctx.fillStyle="#3f8f4b";ctx.fillRect(cx-1,cy-T*.2,2,T*.08)}
      else{ctx.fillStyle=th.dot;const s=T*.16;ctx.fillRect(cx-s/2,cy-s/2,s,s)}
    }else if(c==="o"){
      const pulse=reduce?1:1+Math.sin(time*6)*.15;
      if(mode==="kids"){
        ctx.save();ctx.translate(cx,cy);ctx.rotate(reduce?0:time);ctx.fillStyle="#ff8fc0";
        for(let i=0;i<5;i++){ctx.rotate(Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-T*.2*pulse,T*.11,T*.16,0,0,7);ctx.fill()}
        ctx.fillStyle="#ffd84a";ctx.beginPath();ctx.arc(0,0,T*.12,0,7);ctx.fill();ctx.restore();
      }else{
        ctx.strokeStyle=th.dot;ctx.lineWidth=2;ctx.shadowColor=th.dot;ctx.shadowBlur=10;
        ctx.beginPath();ctx.arc(cx,cy,T*.28*pulse,0,7);ctx.stroke();
        ctx.fillStyle=th.dot;ctx.beginPath();ctx.arc(cx,cy,T*.12,0,7);ctx.fill();ctx.shadowBlur=0;
      }
    }
  }
}
function drawBunny(g,cx,cy,r,face,anim,dead){
  const hop=reduce?0:Math.abs(Math.sin(anim))*r*.12;cy-=hop;
  const wob=reduce?0:Math.sin(anim*.5)*.12;
  for(const s of[-1,1]){g.save();g.translate(cx+s*r*.38,cy-r*.75);g.rotate(s*.18+wob*s);
    g.fillStyle="#ffffff";g.beginPath();g.ellipse(0,-r*.35,r*.24,r*.62,0,0,7);g.fill();
    g.fillStyle="#f7a8c0";g.beginPath();g.ellipse(0,-r*.35,r*.11,r*.45,0,0,7);g.fill();g.restore()}
  g.fillStyle="#ffffff";g.strokeStyle="#d9cbb5";g.lineWidth=1.5;
  g.beginPath();g.arc(cx,cy,r,0,7);g.fill();g.stroke();
  const fx=face?face[0]:0,fy=face?face[1]:0;
  g.fillStyle="#f7a8c0";g.beginPath();g.arc(cx+fx*r*.62,cy+fy*r*.62+r*.08,r*.15,0,7);g.fill();
  g.fillStyle="#2a1d1d";
  if(dead){g.lineWidth=2;g.strokeStyle="#2a1d1d";for(const s of[-1,1]){g.beginPath();g.moveTo(cx+s*r*.35-r*.1,cy-r*.2);g.lineTo(cx+s*r*.35+r*.1,cy-r*.05);g.stroke()}}
  else for(const s of[-1,1]){g.beginPath();g.arc(cx+s*r*.32+fx*r*.25,cy-r*.15+fy*r*.2,r*.11,0,7);g.fill()}
  g.fillStyle="rgba(247,168,192,.6)";for(const s of[-1,1]){g.beginPath();g.arc(cx+s*r*.55,cy+r*.25,r*.13,0,7);g.fill()}
}
function drawProbe(g,cx,cy,r,face,t,dead){
  const pulse=reduce?1:1+Math.sin(t*8)*.05;
  g.save();g.translate(cx,cy);if(dead)g.scale(1-Math.min(1,(1.4-G.dieT)/1.2),1-Math.min(1,(1.4-G.dieT)/1.2));
  g.rotate(reduce?0:t*.8);
  g.shadowColor="#33e1ff";g.shadowBlur=14;g.strokeStyle="#33e1ff";g.fillStyle="rgba(51,225,255,.18)";g.lineWidth=2.2;
  g.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;g.lineTo(Math.cos(a)*r*pulse,Math.sin(a)*r*pulse)}g.closePath();g.fill();g.stroke();
  g.restore();g.save();g.translate(cx,cy);
  const a=face?Math.atan2(face[1],face[0]):0;g.rotate(a);
  g.fillStyle="#e8fdff";g.shadowColor="#33e1ff";g.shadowBlur=8;
  g.beginPath();g.moveTo(r*.55,0);g.lineTo(-r*.15,-r*.35);g.lineTo(0,0);g.lineTo(-r*.15,r*.35);g.closePath();g.fill();
  g.restore();g.shadowBlur=0;
}
function drawBee(g,cx,cy,r,e,flash){
  const fr=e&&e.fright,eaten=e&&e.state==="eaten";
  const face=e&&e.dir?e.dir:[0,1];
  if(!eaten){
    const flap=reduce?0:Math.sin(time*30+(e?e.id:0))*.35;
    g.fillStyle="rgba(255,255,255,.8)";
    for(const s of[-1,1]){g.beginPath();g.ellipse(cx+s*r*.45,cy-r*.75,r*.32,r*.5,s*(.5+flap),0,7);g.fill()}
    g.save();g.beginPath();g.ellipse(cx,cy,r*1.05,r*.9,0,0,7);g.clip();
    g.fillStyle=fr?(flash?"#ffffff":"#c9b8ff"):"#f5c518";g.fillRect(cx-r*1.2,cy-r,r*2.4,r*2);
    g.fillStyle=fr?"#8f7fd6":"#2b2118";
    for(const o of[-.35,.25])g.fillRect(cx+o*r-r*.12,cy-r,r*.24,r*2);
    g.restore();
  }
  // eyes
  const ex=face[0]*r*.25,ey=face[1]*r*.2;
  for(const s of[-1,1]){
    if(fr&&!eaten){g.strokeStyle="#4a3d8f";g.lineWidth=2;g.beginPath();g.moveTo(cx+s*r*.35-r*.14,cy-r*.15);g.lineTo(cx+s*r*.35+r*.14,cy-r*.15);g.stroke()}
    else{g.fillStyle="#fff";g.beginPath();g.arc(cx+s*r*.35+ex*.4,cy-r*.15,r*.24,0,7);g.fill();
      g.fillStyle="#1b1420";g.beginPath();g.arc(cx+s*r*.35+ex,cy-r*.15+ey,r*.12,0,7);g.fill()}
  }
  if(fr&&!eaten){g.fillStyle="#4a3d8f";g.font=`800 ${Math.round(r*.8)}px ${getComputedStyle(document.body).getPropertyValue("--f-body")}`;
    g.fillText("z",cx+r*.7,cy-r*.9-((time*1.5)%1)*r*.6)}
}
function drawGlitch(g,cx,cy,r,e,flash){
  const fr=e.fright,eaten=e.state==="eaten",col=e.color;
  g.save();g.translate(cx,cy);g.rotate(Math.PI/4+(reduce?0:Math.sin(time*3+e.id)*.25));
  if(eaten){g.strokeStyle=col;g.globalAlpha=.6;g.lineWidth=1.5;g.strokeRect(-r*.4,-r*.4,r*.8,r*.8)}
  else{
    const c=fr?(flash?"#ffffff":"#3a5bff"):col;
    g.shadowColor=c;g.shadowBlur=12;g.fillStyle=fr?"rgba(40,60,200,.35)":c+"44";g.strokeStyle=c;g.lineWidth=2.2;
    if(fr)g.setLineDash([3,3]);
    const j=reduce?0:(Math.random()<.08?r*.15:0);
    g.beginPath();g.moveTo(-r*.8+j,-r*.8);g.lineTo(r*.8,-r*.8);g.lineTo(r*.8,r*.3);g.lineTo(r*.5,r*.8);g.lineTo(-r*.8,r*.8);g.closePath();g.fill();g.stroke();
  }
  g.restore();g.shadowBlur=0;g.setLineDash([]);
  const face=e.dir||[0,1];
  g.fillStyle=fr&&!eaten?"#9fb2ff":"#ffffff";
  for(const s of[-1,1]){g.save();g.translate(cx+s*r*.3+face[0]*r*.15,cy-r*.1+face[1]*r*.15);g.rotate(s*.35);
    g.fillRect(-r*.18,-r*.06,r*.36,r*.12);g.restore()}
}
function draw(){
  if(!G||!wallLayer)return;
  ctx.clearRect(0,0,W*T,H*T);
  ctx.drawImage(wallLayer,0,0,W*T,H*T);
  drawDots();
  const flash=G.powerT>0&&G.powerT<2&&Math.floor(time*6)%2===0;
  for(const e of G.en){
    let[x,y]=pos(e);if(e.state==="pen")y+=Math.sin(e.bob*4)*.15;
    const cx=x*T+T/2,cy=y*T+T/2,r=T*.42;
    if(mode==="kids")drawBee(ctx,cx,cy,r,e,flash);else drawGlitch(ctx,cx,cy,r,e,flash);
  }
  const pl=G.pl,[px,py]=pos(pl);
  if(!(state==="dying"&&mode==="adult"&&G.dieT<.2)){
    if(mode==="kids")drawBunny(ctx,px*T+T/2,py*T+T/2+T*.08,T*.38,pl.face,pl.moving?pl.anim:0,state==="dying");
    else drawProbe(ctx,px*T+T/2,py*T+T/2,T*.42,pl.face,time,state==="dying");
  }
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const f of G.floats){ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle=mode==="kids"?"#7a2b8f":"#ffffff";
    ctx.font=`700 ${Math.round(T*.6)}px Chakra Petch, monospace`;ctx.fillText(f.txt,f.x*T+T/2,(f.y-(1-f.t))*T+T/2)}
  ctx.globalAlpha=1;
  let banner=null;
  if(state==="ready")banner=G.readyT>1.5&&G.level>1?"LEVEL "+G.level:(mode==="kids"?"READY? GO!":"READY");
  if(state==="clear")banner=mode==="kids"?"YAY! ALL BERRIES!":"LEVEL CLEAR";
  if(state==="dying"&&mode==="kids")banner="OOPS! BUZZED";
  if(state==="paused")banner="PAUSED";
  if(banner){
    const bx=W*T/2,by=(G.exit[1]+3.5)*T;
    ctx.font=`400 ${Math.round(T*.85)}px Bungee, Impact, sans-serif`;
    const w=ctx.measureText(banner).width+T;
    ctx.fillStyle=mode==="kids"?"rgba(255,247,214,.92)":"rgba(7,7,26,.85)";ctx.fillRect(bx-w/2,by-T*.7,w,T*1.4);
    ctx.fillStyle=mode==="kids"?"#2b6b36":"#ffd84a";ctx.fillText(banner,bx,by+1);
  }
}

/* ---------- HUD & UI ---------- */
function hud(){
  if(!G)return;
  $("score").textContent=G.score;$("level").textContent=G.level;
  $("lives").textContent=G.lives>6?"♥×"+G.lives:"♥".repeat(Math.max(0,G.lives));
  $("best").textContent=Math.max(+(lsGet("md_best_"+mode+"_"+diff)||0),G.score);
}
function showMsg(t,s,sub){$("msgTitle").textContent=t;$("msgScore").textContent=s;$("msgSub").textContent=sub;$("msg").hidden=false}
function syncMenu(){
  $("mKids").setAttribute("aria-pressed",mode==="kids");$("mAdult").setAttribute("aria-pressed",mode==="adult");
  document.querySelectorAll("#diff button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===diff));
  document.body.classList.toggle("kids",mode==="kids");
  $("best").textContent=lsGet("md_best_"+mode+"_"+diff)||0;
  $("muteBtn").textContent=muted?"MUTE":"SND";
  lsSet("md_prefs",JSON.stringify({mode,diff}));
}
$("mKids").onclick=()=>{mode="kids";syncMenu()};
$("mAdult").onclick=()=>{mode="adult";syncMenu()};
document.querySelectorAll("#diff button").forEach(b=>b.onclick=()=>{diff=b.dataset.d;syncMenu()});
function start(){$("menu").hidden=true;$("msg").hidden=true;beep(1,.01,"sine",.0001);newGame()}
$("startBtn").onclick=start;
$("msgBtn").onclick=start;
$("menuBtn").onclick=()=>{state="menu";$("msg").hidden=true;$("menu").hidden=false;syncMenu()};
function togglePause(){if(state==="play"){state="paused"}else if(state==="paused"){state="play"}}
$("pauseBtn").onclick=togglePause;
$("muteBtn").onclick=()=>{muted=!muted;lsSet("md_muted",muted?"1":"0");syncMenu()};

function setWant(k){if(G&&DIRS[k])G.pl.want=DIRS[k]}
const KEYS={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
addEventListener("keydown",e=>{
  if(KEYS[e.key]&&state!=="menu"){setWant(KEYS[e.key]);e.preventDefault()}
  else if((e.key==="p"||e.key==="P"||e.key===" ")&&G&&(state==="play"||state==="paused")){togglePause();e.preventDefault()}
  else if(e.key==="Enter"&&!$("menu").hidden)start();
});
let sx=0,sy=0,tracking=false;
stage.addEventListener("pointerdown",e=>{if(e.target!==cv)return;sx=e.clientX;sy=e.clientY;tracking=true});
stage.addEventListener("pointermove",e=>{if(!tracking)return;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.hypot(dx,dy)>22){setWant(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));sx=e.clientX;sy=e.clientY}});
addEventListener("pointerup",()=>tracking=false);
document.querySelectorAll(".pad button").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();setWant(b.dataset.k)}));

// menu previews
(function previews(){
  const a=$("pvKids").getContext("2d"),b=$("pvAdult").getContext("2d");
  a.fillStyle="#e3f3c4";a.fillRect(0,0,60,44);
  drawBunny(a,18,26,9,[1,0],0,false);
  const fakeTime=time;drawBee(a,44,24,8,{id:0,dir:[-1,0],fright:false,state:"normal"},false);
  b.fillStyle="#07071a";b.fillRect(0,0,60,44);
  drawProbe(b,18,22,9,[1,0],0,false);
  drawGlitch(b,44,22,8,{id:0,dir:[-1,0],fright:false,state:"normal",color:"#ff4d5e"},false);
})();

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G&&state!=="menu"&&state!=="over"&&state!=="paused")update(dt);else time+=dt;
  draw();hud();requestAnimationFrame(loop);
}
addEventListener("resize",resize);
syncMenu();requestAnimationFrame(loop);
})();
</script>
